[package]
name = "gantry"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Transparent offload shim for expensive cargo commands."
license = "MIT OR Apache-2.0"

[[bin]]
name = "gantry"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Single static-binary distribution (plan DD-6). Optimize the shipped shim.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
